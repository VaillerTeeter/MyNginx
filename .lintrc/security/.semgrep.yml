# Semgrep —— 本仓库专属规则（最严格档）
#
# 定位：通用 SAST 规则由 CI 的 registry 规则集负责（p/owasp-top-ten、p/secrets、
#       p/security-audit、p/r2c-security-audit、p/github-actions）；本文件只放
#       通用规则集覆盖不到的两类：
#         1) nginx 配置（.conf）的加固规则 —— 与 gixy、nginx -t 互补、可版本化
#         2) 工作流的供应链 / 权限规则
#
# 用法：semgrep scan --config .lintrc/security/.semgrep.yml \
#                    --config p/github-actions \
#                    --exclude .lintrc/ --exclude conf.d/error/ .
#
# 机制：
#   · languages: [generic]（GA）—— 按「文本 + 缩进」匹配
#   · options.generic_comment_style: shell —— `#` 注释不参与匹配
#     ⇒ 被注释掉的加固指令会被「缺失检查」判为缺失（有意的最严格行为）
#   · 缺失检查 = pattern-regex '(?s).+' + pattern-not-regex（文件级 conjunction）
#   · 块级检查 = pattern-inside（依赖 generic 的缩进 / 花括号嵌套）
#   · pattern-regex 为 PCRE2 语法（支持 (?i)(?m)(?s)、lookahead、lookbehind）
#
# 严重度：ERROR = 明确危险（建议阻断）；WARNING = 加固项（可阻断、也可只提示）
# 注意：CI 用 `--error` 时「任何 severity 的命中都会返回 1」（官方 exit code 文档）；
#       需要「只提示」的规则请在 CI 分段，或在具体位置写 `# nosemgrep: <rule-id>` 说明原因。
#
# 本文件只在 GitHub Actions 的 sast-scan job 中运行；细节以 CI 输出为准迭代。

rules:
  # ============================================================
  # A. TLS / SSL
  # ============================================================
  - id: nginx-tls-weak-protocol
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '(?i)^\s*(?:proxy_)?ssl_protocols\s+[^;]*(?:SSLv2|SSLv3|TLSv1(?!\.[23]))'
    severity: ERROR
    message: ssl_protocols / proxy_ssl_protocols 含 SSLv2 / SSLv3 / TLSv1.0 / TLSv1.1；只允许 TLSv1.2、TLSv1.3。
    metadata: { cwe: "CWE-326", technology: [nginx] }

  - id: nginx-ssl-protocols-not-explicit
    languages: [generic]
    paths: { include: ["nginx.conf", "**/nginx.conf"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*ssl_protocols\s+[^;]*TLSv1\.2'
    severity: ERROR
    message: 未显式声明 ssl_protocols 且启用 TLSv1.2（nginx 内置默认值包含已淘汰版本），必须显式指定 TLSv1.2/1.3。
    metadata: { cwe: "CWE-326", technology: [nginx] }

  - id: nginx-ssl-session-tickets-on
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*ssl_session_tickets\s+on\s*;'
    severity: ERROR
    message: ssl_session_tickets on 削弱前向保密（票据密钥不轮换时历史流量可被解密）；严格场景应设为 off。
    metadata: { cwe: "CWE-310", technology: [nginx] }

  - id: nginx-ssl-session-cache-off
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*ssl_session_cache\s+off'
    severity: ERROR
    message: 关闭了 ssl_session_cache，TLS 会话无法复用（握手与 CPU 开销显著上升）；应使用 shared 缓存。
    metadata: { technology: [nginx] }

  - id: nginx-ssl-prefer-server-ciphers-off
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*ssl_prefer_server_ciphers\s+off'
    severity: ERROR
    message: ssl_prefer_server_ciphers off 让客户端决定套件优先级（可能选中较弱套件）；应设为 on。
    metadata: { cwe: "CWE-326", technology: [nginx] }

  - id: nginx-ssl-ciphers-weak-token
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '(?i)^\s*(?:proxy_)?ssl_ciphers\s+[^;]*?(?:(?<![!a-zA-Z0-9-])(?:RC4|DES|EXPORT|NULL|MD5|CBC3|ADH|PSK)|(?<![!-])3DES)'
    severity: ERROR
    message: >-
      ssl_ciphers 中出现弱算法 / 弱模式（RC4、DES/3DES、EXPORT、NULL、MD5、CBC3、ADH、PSK）。
      规则使用取反感知的 lookbehind：`!RC4`、`!aNULL`、`!EDH-DSS-DES-CBC3-SHA` 这类「排除写法」不会误报。
    metadata: { cwe: "CWE-327", technology: [nginx] }

  - id: nginx-ssl-stapling-off
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*ssl_stapling\s+off'
    severity: WARNING
    message: 显式关闭 OCSP stapling；建议 ssl_stapling on 且 ssl_stapling_verify on。
    metadata: { technology: [nginx] }

  - id: nginx-proxy-ssl-verify-off
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*proxy_ssl_verify\s+off'
    severity: ERROR
    message: proxy_ssl_verify off 表示不校验上游 HTTPS 证书，无法防御中间人。
    metadata: { cwe: "CWE-295", technology: [nginx] }

  - id: nginx-missing-proxy-ssl-verify-on
    languages: [generic]
    paths: { include: ["nginx.conf", "**/nginx.conf"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*proxy_ssl_verify\s+on\s*;'
    severity: ERROR
    message: 未启用 proxy_ssl_verify on（被注释也算缺失），代理到上游 HTTPS 时不做证书校验。
    metadata: { cwe: "CWE-295", technology: [nginx] }

  - id: nginx-missing-ssl-stapling
    languages: [generic]
    paths: { include: ["nginx.conf", "**/nginx.conf"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*ssl_stapling\s+on\s*;'
    severity: WARNING
    message: 未启用 OCSP stapling（ssl_stapling on），客户端需自行向 CA 查询吊销状态。
    metadata: { technology: [nginx] }

  # ---- 以上为 A 组（TLS / SSL）----

  # ============================================================
  # B. 信息暴露 / 安全响应头
  # ============================================================
  - id: nginx-server-tokens-on
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*server_tokens\s+on\s*;'
    severity: ERROR
    message: server_tokens on 会在响应头与错误页暴露 nginx 版本号；必须 off。
    metadata: { cwe: "CWE-200", technology: [nginx] }

  - id: nginx-autoindex-on
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*autoindex\s+on\s*;'
    severity: ERROR
    message: autoindex on 暴露目录结构与文件清单；除明确的静态下载目录外必须 off。
    metadata: { cwe: "CWE-548", technology: [nginx] }

  - id: nginx-add-header-without-always
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*add_header\s+(?![^\n]*always)[^\n]*;'
    severity: ERROR
    message: add_header 未带 always，安全响应头不会出现在 4xx/5xx 响应上；安全类响应头必须加 always。
    metadata: { technology: [nginx] }

  - id: nginx-missing-hsts
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)Strict-Transport-Security'
    severity: ERROR
    message: 缺少 HSTS（Strict-Transport-Security），HTTPS 站点可被降级 / 劫持；建议 max-age 至少 31536000。
    metadata: { cwe: "CWE-319", technology: [nginx] }

  - id: nginx-missing-x-content-type-options
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)X-Content-Type-Options'
    severity: ERROR
    message: "缺少 X-Content-Type-Options: nosniff，浏览器可能对响应做 MIME 嗅探。"
    metadata: { cwe: "CWE-436", technology: [nginx] }

  - id: nginx-missing-frame-protection
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)X-Frame-Options'
      - pattern-not-regex: '(?i)frame-ancestors'
    severity: ERROR
    message: 既无 X-Frame-Options 也无 CSP frame-ancestors，页面可被任意站点 iframe 嵌套（点击劫持）。
    metadata: { cwe: "CWE-1021", technology: [nginx] }

  - id: nginx-missing-referrer-policy
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)Referrer-Policy'
    severity: WARNING
    message: 缺少 Referrer-Policy，跨站跳转会泄漏完整 URL（含查询串中的敏感参数）。
    metadata: { cwe: "CWE-200", technology: [nginx] }

  - id: nginx-missing-csp
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)Content-Security-Policy'
    severity: WARNING
    message: 缺少 Content-Security-Policy，缺少对 XSS 与资源加载来源的第二道防线。
    metadata: { cwe: "CWE-693", technology: [nginx] }

  - id: nginx-missing-permissions-policy
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)Permissions-Policy'
    severity: WARNING
    message: 缺少 Permissions-Policy，无法显式关闭不需要的浏览器特性（camera / geolocation / clipboard 等）。
    metadata: { technology: [nginx] }

  - id: nginx-missing-proxy-hide-upstream-headers
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?im)^\s*proxy_hide_header\s+Server'
      - pattern-not-regex: '(?im)^\s*proxy_hide_header\s+X-Powered-By'
    severity: WARNING
    message: 未隐藏上游的 Server / X-Powered-By 响应头，会泄漏后端技术栈与版本。
    metadata: { cwe: "CWE-200", technology: [nginx] }

  # ---- 以上为 B 组（信息暴露 / 安全响应头）----

  # ============================================================
  # C. 请求侧 / 滥用防护
  # ============================================================
  - id: nginx-dynamic-proxy-pass
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-either:
      - pattern-regex: 'proxy_pass\s+\$'
      - pattern-regex: 'proxy_pass\s+https?://\$(?:http_|arg_|cookie_|host|request_uri)'
    severity: ERROR
    message: proxy_pass 使用变量（尤其 scheme 或来自请求的变量），可能被构造成开放代理 / SSRF；应硬编码 scheme 与上游地址。
    metadata: { cwe: "CWE-918", technology: [nginx] }

  - id: nginx-open-redirect-user-input
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*(?:return\s+30[0-9]\s+\$arg_|add_header\s+\S+\s+\$arg_)'
    severity: ERROR
    message: 把 $arg_* 用户输入直接用于跳转或响应头，可能导致开放重定向 / HTTP 响应拆分。
    metadata: { cwe: "CWE-601", technology: [nginx] }

  - id: nginx-referer-as-access-control
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*if\s*\(\s*\$http_referer'
    severity: ERROR
    message: 用 $http_referer 做访问控制（Referer 可伪造）；请改用 $remote_addr 白名单或后端鉴权。
    metadata: { cwe: "CWE-290", technology: [nginx] }

  - id: nginx-real-ip-from-any
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*set_real_ip_from\s+(?:0\.0\.0\.0/0|::/0)'
    severity: ERROR
    message: set_real_ip_from 接受任意来源（0.0.0.0/0 或 ::/0），攻击者可伪造 X-Forwarded-For / X-Real-IP 绕过基于 IP 的限流与封禁。
    metadata: { cwe: "CWE-290", technology: [nginx] }

  - id: nginx-missing-limit-req
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*limit_req\s'
    severity: WARNING
    message: 未使用 limit_req（请求速率限制），缺少对暴力破解 / 爬虫 / CC 攻击的第一道防线。
    metadata: { cwe: "CWE-770", technology: [nginx] }

  - id: nginx-missing-limit-conn
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*limit_conn\s'
    severity: WARNING
    message: 未使用 limit_conn（并发连接限制），单客户端可耗尽 worker 连接数。
    metadata: { cwe: "CWE-770", technology: [nginx] }

  - id: nginx-missing-client-max-body-size
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*client_max_body_size\s'
    severity: WARNING
    message: 未设置 client_max_body_size，大体积请求体可能造成磁盘 / 内存压力。
    metadata: { cwe: "CWE-770", technology: [nginx] }

  - id: nginx-missing-timeouts
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*client_body_timeout\s'
      - pattern-not-regex: '(?m)^\s*client_header_timeout\s'
      - pattern-not-regex: '(?m)^\s*send_timeout\s'
    severity: WARNING
    message: 缺少 client_body_timeout / client_header_timeout / send_timeout，慢速连接会长期占用 worker（slowloris）。
    metadata: { cwe: "CWE-400", technology: [nginx] }

  - id: nginx-deprecated-directive
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*(?:ssl\s+on\s*;|listen\s+\S+\s+spdy\b|listen\s+\S+\s+ssl\s+http2\b)'
    severity: WARNING
    message: 使用已废弃的指令 / 写法（ssl on; / listen ... spdy / listen ... ssl http2）；请改用 ssl 参数与独立的 http2 指令。
    metadata: { technology: [nginx] }

  - id: nginx-missing-default-server
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?m)^\s*listen\s+[^;]*default_server'
    severity: WARNING
    message: 没有 default_server 兜底，未知 Host 的请求会落到第一个匹配的 vhost（可能泄漏内容或串站）。
    metadata: { technology: [nginx] }

  # ------------------------------------------------------------
  # 块级检查：generic 模式按「缩进 + 花括号」判断嵌套
  # ⚠️ 这两条依赖 generic 嵌套匹配，行为以 CI 输出为准，必要时再调整
  # ------------------------------------------------------------
  - id: nginx-alias-in-regex-location
    languages: [generic]
    paths: { include: ["**/*.conf", "**/*.nginx"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-inside: |
          location ~ $RE {
            ...
          }
      - pattern: alias $PATH;
    severity: ERROR
    message: 正则 location 内使用 alias 且未精确锚定，易造成路径穿越（与 gixy 的 alias_traversal 同类风险）。
    metadata: { cwe: "CWE-22", technology: [nginx] }

  - id: nginx-server-block-missing-security-headers
    languages: [generic]
    paths: { include: ["conf.d/*.conf", "conf.d/**/*.conf", "sites-available/*", "sites-enabled/*"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-inside: |
          server {
            ...
          }
      - pattern-regex: '(?s).+'
      - pattern-not-regex: '(?i)Strict-Transport-Security'
    severity: ERROR
    message: 存在未设置 HSTS 的 server 块（块级检查：任意一个 server 块缺少该响应头即报告）。
    metadata: { cwe: "CWE-319", technology: [nginx] }

  # ---- 以上为 C 组（请求侧 / 滥用防护）----

  # ============================================================
  # D. 工作流（供应链 / 权限）
  # ============================================================
  - id: gha-action-on-mutable-branch
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*uses:\s*[^@\s]+@(?:main|master|HEAD|develop)\s*$'
    severity: ERROR
    message: 第三方 action 引用了会移动的分支（@main / @master / @develop / @HEAD），上游被入侵或强推即等于执行任意代码。
    metadata: { cwe: "CWE-1357" }

  - id: gha-action-not-pinned-to-sha
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*uses:\s*[^@\s]+@v?\d+(?:\.\d+)*\s*$'
    severity: WARNING
    message: 第三方 action 只钉到 tag（@v3 之类），tag 可被重新指向；最严格应钉到 40 位 commit SHA。
    metadata: { cwe: "CWE-1357" }

  - id: gha-curl-pipe-shell
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    pattern-regex: 'curl[^|\n]*\|\s*(?:sudo\s+)?(?:ba|z|k)?sh\b'
    severity: ERROR
    message: curl 输出直接管道给 shell（curl | sh / bash），远端内容被篡改即等于在 runner 上执行任意代码。
    metadata: { cwe: "CWE-494" }

  - id: gha-write-all-permissions
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    pattern-regex: '^\s*permissions:\s*write-all'
    severity: ERROR
    message: "write-all 给 GITHUB_TOKEN 全仓库写权限；请按 job 最小化授权（默认 contents: read）。"
    metadata: { cwe: "CWE-250" }

  - id: gha-pull-request-target-pr-checkout
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?m)^\s*pull_request_target:'
      - pattern-regex: 'refs/pull/'
    severity: ERROR
    message: 同时使用 pull_request_target 与检出 PR 代码（refs/pull/...），不受信任代码会在持有 secrets 的上下文里执行。
    metadata: { cwe: "CWE-284" }

  - id: gha-issue-comment-pr-head-checkout
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    patterns:
      - pattern-regex: '(?m)^\s*issue_comment:'
      - pattern-regex: 'refs/pull/'
    severity: ERROR
    message: "issue_comment 触发的工作流检出了 PR 分支代码（评论者可以是任何人）；确属有意功能时用 `# nosemgrep: gha-issue-comment-pr-head-checkout` 注明原因。"
    metadata: { cwe: "CWE-284" }

  - id: gha-untrusted-context-in-run
    languages: [generic]
    paths: { include: [".github/workflows/*.yml", ".github/workflows/*.yaml"] }
    options: { generic_comment_style: shell }
    pattern-regex: '(?mi)^[^#\n]*\$\{\{\s*github\.event\.[^}]*\.(?:title|body|head_ref|label|message|email|ref)\b'
    severity: ERROR
    message: >-
      把 github.event.* 的不可信字段（title / body / head_ref / label / message / email / ref）插入工作流表达式，
      在 run 脚本中会造成脚本注入（在 if / env 中一般为良性，可用 `# nosemgrep` 豁免）；
      更精确的 AST 版本来自 registry 的 p/github-actions。
    metadata: { cwe: "CWE-78" }



