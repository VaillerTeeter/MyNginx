# ================================================================================
# 文件：nginx.conf
# 用途：Nginx 主配置文件 - 高性能、高安全、生产级配置
# 关键指令：user|worker_processes|events|http|server|location|ssl|proxy|gzip|log
# 本文件无函数/变量（不适用）
# ================================================================================

# --- Main Context ---
# user 指令：设置 Nginx worker 进程的运行用户
# 类型：String | 作用域：Main
# 默认值：nobody | 安全性：使用非 root 用户防止权限提升攻击
user nginx;

# worker_processes 指令：设置 worker 进程数
# 类型：Number/auto | 作用域：Main | 默认值：1
# 推荐值：auto（自动检测 CPU 核心数，通常等于 CPU 核数）
# 性能提示：最优化通常为 CPU 核数，过多会导致上下文切换开销增加
worker_processes auto;

# worker_cpu_affinity 指令：绑定 worker 进程到特定 CPU 核心
# 类型：String/auto | 作用域：Main | 默认值：无（未启用）
# 作用：提升 CPU 缓存命中率，降低跨核通信开销
# auto 模式自动分配，提升多核系统性能，禁用则设为：worker_cpu_affinity ""
worker_cpu_affinity auto;

# worker_priority 指令：设置 worker 进程的 CPU 调度优先级（Nice 值）
# 类型：Integer(-20 ~ 20) | 作用域：Main | 默认值：0
# 负值=更高优先级，正值=更低优先级
# 推荐值：0（与主进程同级）或 -10（轻度提升）
worker_priority 0;

# worker_rlimit_nofile 指令：设置单个 worker 进程可打开的最大文件描述符数
# 类型：Number | 作用域：Main | 默认值：65535（Linux 系统限制）
# 关键指标：应大于 worker_connections + 其他预留数（如临时文件）
# 高流量场景建议设为 200000+ 或系统最大值
worker_rlimit_nofile 200000;

# worker_rlimit_core 指令：限制 core dump 文件大小（调试用）
# 类型：Number/unlimited | 作用域：Main | 默认值：0（禁用）
# 仅在需要生成崩溃调试文件时启用，生产环境通常置为 0
# worker_rlimit_core unlimited;

# error_log 指令：设置全局错误日志路径和级别
# 类型：String[Level] | 作用域：Main,http,server,location | 默认值：logs/error.log error
# 级别：debug > info > notice > warn > error > crit > alert > emerg
# debug（最详细，性能影响大），生产环境推荐 warn 或 error
error_log /var/log/nginx/error.log warn;

# pid 指令：设置 Nginx 主进程 PID 文件路径
# 类型：String | 作用域：Main | 默认值：logs/nginx.pid
# 用途：支持 systemd/init 脚本的进程管理和信号发送
pid /run/nginx.pid;

# ================================================================================
# Events Context：配置连接处理引擎（epoll/kqueue/select）
# ================================================================================

events {
    # worker_connections 指令：单个 worker 进程能处理的最大并发连接数
    # 类型：Number | 作用域：Events | 默认值：512
    # 性能计算：max_clients = worker_processes * worker_connections
    # 每个连接消耗约 256B 内存，设置过高会浪费内存，过低导致连接被拒绝
    # 推荐值：10000-100000（根据硬件和流量调整）
    worker_connections 10000;

    # use 指令：指定事件驱动模型（epoll/kqueue/select/poll）
    # 类型：String | 作用域：Events | 默认值：auto（自动选择最优）
    # epoll    ：Linux 2.6+ 推荐（高效，支持大量连接）/ poll    ：Linux 较旧版本
    # kqueue   ：BSD/macOS 推荐/ select   ：所有系统支持（低效，不推荐）
    # 通常无需显式配置，auto 会自动选择系统最优方案
    # use epoll;

    # multi_accept 指令：worker 进程一次是否处理多个连接（开启可加速连接处理）
    # 类型：on|off | 作用域：Events | 默认值：off
    # 开启时，单个 worker 可在一个信号中接受多个连接，峰值流量场景推荐开启
    multi_accept on;
}

# ================================================================================
# HTTP Context：HTTP 服务配置（包含 server 和 location）
# ================================================================================

http {
    # include 指令：加载包含 MIME 类型的 mime.types 文件
    # 类型：String | 作用域：http,server,location | 默认值：无
    # 作用：为响应自动添加对应的 Content-Type 头
    include /etc/nginx/mime.types;

    # default_type 指令：未在 mime.types 中定义时的默认 MIME 类型
    # 类型：String | 作用域：http,server,location | 默认值：text/plain
    # 通常设为 application/octet-stream 让浏览器下载未知类型的文件
    default_type application/octet-stream;

    # ============ 性能优化配置 ============

    # sendfile 指令：启用 Linux sendfile() 系统调用零复制技术
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 性能收益：减少内存复制，CPU 占用降低 50%+，适合静态文件服务
    # 注意：不适用于动态内容生成或需要修改响应体的场景
    sendfile on;

    # tcp_nopush 指令：启用 TCP_CORK 选项，延迟发送小包，合并为大包
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 性能收益：减少网络包数，降低带宽浪费，与 sendfile 配合最优
    # 必须与 sendfile 一起启用才有效果
    tcp_nopush on;

    # tcp_nodelay 指令：启用 TCP_NODELAY 选项，禁用 Nagle 算法
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # 作用：实时发送数据，减少延迟，WebSocket/实时应用必须启用
    # 生产环境保持开启，只在需要批量传输时才考虑关闭
    tcp_nodelay on;

    # ============ 缓冲和 I/O 配置 ============

    # client_body_buffer_size 指令：读取客户端请求体的缓冲区大小
    # 类型：Size | 作用域：http,server,location | 默认值：8k/16k
    # 超过此大小的请求体会写入临时文件，推荐 16k-128k
    client_body_buffer_size 128k;

    # client_header_buffer_size 指令：读取客户端请求头的缓冲区大小
    # 类型：Size | 作用域：http,server | 默认值：1k
    # 推荐值：1k-4k（大多数请求适用），超大请求用 large_client_header_buffers
    client_header_buffer_size 4k;

    # large_client_header_buffers 指令：处理超大请求头（超过 client_header_buffer_size）
    # 类型：Number Size | 作用域：http,server | 默认值：4 8k
    # 参数：缓冲数量 单个大小 | 推荐值：4 32k
    large_client_header_buffers 4 32k;

    # client_max_body_size 指令：允许的最大客户端请求体大小
    # 类型：Size | 作用域：http,server,location | 默认值：1m
    # 网盘和媒体库场景：需要支持大文件上传
    # 设为 1g，支持GB级别文件上传（根据实际磁盘容量调整）
    # 云服务器存储足够时，可改为 0（无限制）
    client_max_body_size 1g;

    # client_body_temp_path 指令：超大请求体临时文件存储路径
    # 类型：Path | 作用域：http,server,location | 默认值：client_body_temp
    # 分级目录结构可提高文件系统查找效率
    client_body_temp_path /var/cache/nginx/client_body_temp 1 2;

    # ============ 超时配置 ============

    # client_body_timeout 指令：读取客户端请求体的超时时间
    # 类型：Time | 作用域：http,server,location | 默认值：60s
    # 超时后返回 408 错误，防止攻击者持续占用连接
    client_body_timeout 60s;

    # client_header_timeout 指令：读取客户端请求头的超时时间
    # 类型：Time | 作用域：http,server | 默认值：60s
    # 过短可能拒绝慢速网络，推荐 30s-60s
    client_header_timeout 60s;

    # send_timeout 指令：发送响应体给客户端的超时时间
    # 类型：Time | 作用域：http,server,location | 默认值：60s
    # FRP 代理场景：可能涉及大文件传输，从本地网站代理到云服务器
    # 增加超时时间到 120s，支持网盘/媒体库的大文件传输
    send_timeout 120s;

    # keepalive_timeout 指令：Keep-Alive 连接从未使用后的超时时间
    # 类型：Time [Time] | 作用域：http,server | 默认值：75s
    # FRP 代理场景：需要维持长连接以支持持续的本地服务代理
    # 设为 75s，允许更长的连接复用（减少重连开销）
    keepalive_timeout 75s 75s;

    # keepalive_requests 指令：单个连接最多处理的请求数
    # 类型：Number | 作用域：http,server | 默认值：1000
    # 个人场景：增加到 1000，支持持久连接处理更多请求
    # FRP 代理连接预期会处理大量请求，较高的值有益
    keepalive_requests 1000;

    # keepalive_time 指令：单个 Keep-Alive 连接的最大可用时间
    # 类型：Time | 作用域：http,server | 默认值：1h
    # 达到时间后新请求会关闭连接，防止长期占用资源
    keepalive_time 1h;

    # lingering_close 指令：关闭连接前是否等待和丢弃剩余数据
    # 类型：off|on|always | 作用域：http,server,location | 默认值：on
    # off    ：立即关闭（可能丢失数据，不符合 HTTP 规范）
    # on     ：仅在需要时等待（推荐）
    # always ：总是等待（防御攻击但性能消耗）
    lingering_close on;

    # lingering_timeout 指令：等待剩余数据的最大等待时间
    # 类型：Time | 作用域：http,server,location | 默认值：5s
    lingering_timeout 5s;

    # ============ Hash 表性能配置 ============

    # types_hash_max_size 指令：MIME 类型 hash 表最大大小
    # 类型：Number | 作用域：http,server,location | 默认值：1024
    # 建议值：1024-2048，避免 hash 冲突导致性能下降
    types_hash_max_size 2048;

    # types_hash_bucket_size 指令：MIME 类型 hash 表 bucket 大小
    # 类型：Number | 作用域：http,server,location | 默认值：64
    # 自动选择，通常无需调整
    # types_hash_bucket_size 64;

    # server_names_hash_max_size 指令：服务器名称 hash 表最大大小
    # 类型：Number | 作用域：http | 默认值：512
    # server_name 过多时增加此值，避免 hash 冲突
    server_names_hash_max_size 512;

    # server_names_hash_bucket_size 指令：服务器名称 hash 表 bucket 大小
    # 类型：Number | 作用域：http | 默认值：32/64/128（取决于 CPU）
    # 自动调整，通常无需显式配置
    server_names_hash_bucket_size 64;

    # variables_hash_max_size 指令：变量 hash 表最大大小
    # 类型：Number | 作用域：http | 默认值：1024
    variables_hash_max_size 1024;

    # variables_hash_bucket_size 指令：变量 hash 表 bucket 大小
    # 类型：Number | 作用域：http | 默认值：64
    # variables_hash_bucket_size 64;

    # ============ 地址和服务器识别 ============

    # server_tokens 指令：是否在错误页面和 Server 响应头中暴露 Nginx 版本
    # 类型：on|off|build|string | 作用域：http,server,location | 默认值：on
    # 安全建议：设为 off，隐藏版本号防止针对性攻击
    server_tokens off;

    # server_name_in_redirect 指令：重定向中是否使用 server_name 指令的主服务器名
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # off 时使用 Host 请求头中的名称，更符合客户端预期
    server_name_in_redirect off;

    # port_in_redirect 指令：重定向中是否包含端口号
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # 通常保持开启，确保重定向目标正确
    port_in_redirect on;

    # absolute_redirect 指令：重定向是否使用绝对 URI
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # on  ：使用绝对 URI（标准）/ off ：使用相对 URI
    absolute_redirect on;

    # ============ 文件处理和日志 ============

    # log_not_found 指令：是否在错误日志中记录404错误
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # 高并发场景下关闭可减少日志 I/O，但影响调试排查
    log_not_found on;

    # log_subrequest 指令：是否在访问日志中记录子请求（内部跳转）
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 仅在需要审计内部流程时启用，通常关闭
    log_subrequest off;

    # merge_slashes 指令：是否合并 URI 中连续的多个斜杠为单个斜杠
    # 类型：on|off | 作用域：http,server | 默认值：on
    # on  ："/foo//bar" → "/foo/bar"（提高 location 匹配效率，加强安全）
    # off ：保留原样（Base64 等特殊编码需要关闭）
    merge_slashes on;

    # ============ 访问日志配置 ============

    # log_format 指令：自定义日志格式
    # 类型：String | 作用域：http | 默认值：main 格式
    # 变量说明：
    #   $remote_addr     ：客户端 IP
    #   $remote_user     ：认证用户名（无则为 "-"）
    #   $time_local      ：本地时间（常规格式）
    #   $request         ：完整请求行（GET /path HTTP/1.1）
    #   $status          ：响应状态码
    #   $body_bytes_sent ：响应体字节数
    #   $http_referer    ：来源页面（Referer 请求头）
    #   $http_user_agent ：用户代理（浏览器/应用标识）
    #   $http_x_forwarded_for ：代理传递的原始客户端 IP
    #   $request_time    ：请求处理时间（秒）
    #   $upstream_response_time ：上游服务器响应时间
    #   $scheme          ：协议（http/https）
    #   $request_length  ：请求长度（含头和体）
    #   $gzip_ratio      ：Gzip 压缩率
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    # 扩展日志格式：用于性能分析和审计
    log_format extended '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '"$http_x_forwarded_for" '
                        'request_time=$request_time '
                        'upstream_response_time=$upstream_response_time '
                        'scheme=$scheme request_length=$request_length '
                        'gzip_ratio=$gzip_ratio connection=$connection '
                        'connection_requests=$connection_requests';

    # access_log 指令：设置访问日志路径和格式
    # 类型：String [String] | 作用域：http,server,location | 默认值：logs/access.log combined
    # 可使用多个 access_log 写入不同日志文件
    # buffer=size 启用缓冲（减少 I/O），flush=time 定期刷新缓冲
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ============ 限流和防护配置 ============

    # limit_req_zone 指令：创建限流控制区域
    # 类型：String String String | 作用域：http | 默认值：无
    # 参数：zone=名称:容量 key rate 日志级别
    # 针对个人场景（仅自己使用）的限流配置：
    # - general：30r/s 足以防止单点故障，不会限制正常使用
    # - api：15r/s 为可能的 API 调用提供余量
    # - strict：仅用于防止明显的自动化攻击，限制较宽松
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;
    
    # Nyaa 专用限流区域（国外网站，需要宽松的限制）
    # 5r/s ：较宽松的限制，防止被 Nyaa 服务器封 IP
    # Nyaa 有反爬虫机制，频繁请求会导致 4xx 错误
    limit_req_zone $binary_remote_addr zone=nyaa:10m rate=5r/s;

    # limit_conn_zone 指令：创建连接数控制区域
    # 类型：String String | 作用域：http | 默认值：无
    # 限制单个客户端 IP 最多并发连接数
    # 防止单一 IP 占用过多连接资源
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # map 指令：根据条件映射变量值（用于动态限流）
    # 类型：String String { ... } | 作用域：http | 默认值：无
    # 用途：根据请求特征（URI、User-Agent 等）决定是否放宽限制
    # 例：爬虫/API 客户端可能需要更严格的限制
    map $request_uri $limit_zone {
        default "general";
        ~^/api/  "api";
        ~^/admin/ "strict";
    }

    # ============ GZIP 压缩配置 ============

    # gzip 指令：启用 Gzip 响应体压缩
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 性能收益：平均压缩率 50-80%，减少带宽消耗，客户端自动解压
    # 注意：CPU 增加，实时性内容可能不需要压缩
    gzip on;

    # gzip_vary 指令：是否在响应头添加 Vary: Accept-Encoding
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 必须启用，让代理服务器正确缓存压缩和未压缩版本
    gzip_vary on;

    # gzip_proxied 指令：对代理请求是否启用压缩
    # 类型：off|expired|no-cache|no-store|private|no_last_modified|no_etag|auth|any
    # 作用域：http,server,location | 默认值：off
    # any  ：压缩所有代理响应 / off ：不压缩
    gzip_proxied any;

    # gzip_comp_level 指令：Gzip 压缩等级（1-9）
    # 类型：Number | 作用域：http,server,location | 默认值：1
    # 1    ：最快，压缩率低
    # 6    ：平衡速度和压缩率（推荐）
    # 9    ：最优压缩，速度慢，CPU 占用高
    gzip_comp_level 6;

    # gzip_min_length 指令：响应体小于此值不压缩
    # 类型：Size | 作用域：http,server,location | 默认值：20
    # 推荐值：1024 或更大（太小的响应压缩收益不值得 CPU 消耗）
    gzip_min_length 1024;

    # gzip_buffers 指令：压缩缓冲区数量和大小
    # 类型：Number Size | 作用域：http,server,location | 默认值：32 4k|16 8k
    # 参数：buffer_number buffer_size
    # 推荐值：16 8k 或 32 16k（128K 总缓冲通常足够）
    gzip_buffers 16 8k;

    # gzip_http_version 指令：最低 HTTP 版本要求
    # 类型：String | 作用域：http,server,location | 默认值：1.1
    # HTTP/1.0 不支持 Transfer-Encoding: chunked，保持 1.1
    gzip_http_version 1.1;

    # gzip_types 指令：对哪些 MIME 类型启用压缩
    # 类型：String | 作用域：http,server,location | 默认值：text/html
    # 推荐压缩：文本、JSON、XML、SVG、JavaScript、CSS
    # 不推荐：已压缩格式（jpg/png/zip）、视频流、二进制文件
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        font/eot;

    # gzip_disable 指令：对哪些 User-Agent 禁用压缩
    # 类型：String (regex) | 作用域：http,server,location | 默认值：msie6
    # 某些旧浏览器处理 Gzip 有问题，此处列出
    gzip_disable "msie6";

    # ============ 代理相关配置 ============

    # proxy_headers_hash_max_size 指令：代理请求头 hash 表最大大小
    # 类型：Number | 作用域：http | 默认值：512
    # 自定义代理头很多时增加此值
    proxy_headers_hash_max_size 512;

    # proxy_headers_hash_bucket_size 指令：代理请求头 hash 表 bucket 大小
    # 类型：Number | 作用域：http | 默认值：64
    proxy_headers_hash_bucket_size 64;

    # proxy_buffering 指令：是否缓冲来自上游服务器的响应
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # on  ：缓冲响应，快速释放上游连接（推荐 FRP 场景）
    # off ：实时转发，支持流式传输（媒体库需要时可关闭）
    # 默认 on，可在特定 location（如视频流）覆盖为 off
    proxy_buffering on;

    # proxy_buffer_size 指令：接收上游响应头的缓冲区大小
    # 类型：Size | 作用域：http,server,location | 默认值：4k|8k
    # 个人场景：保持 8k（响应头通常不会很大）
    proxy_buffer_size 8k;

    # proxy_buffers 指令：缓冲响应体的缓冲区数量和大小
    # 类型：Number Size | 作用域：http,server,location | 默认值：8 4k|8k
    # 个人场景：保持 8 8k（总 64KB，适于小流量）
    # 大文件场景可调整为：16 16k（总 256KB）以提高吞吐
    proxy_buffers 8 8k;

    # proxy_busy_buffers_size 指令：数据繁忙时使用的缓冲区大小
    # 类型：Size | 作用域：http,server,location | 默认值：16k
    proxy_busy_buffers_size 16k;

    # proxy_temp_path 指令：过大响应体缓存到文件的路径
    # 类型：Path | 作用域：http | 默认值：proxy_temp
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;

    # proxy_ssl_protocols 指令：与上游 HTTPS 服务器通信的 TLS 协议版本
    # 类型：String | 作用域：http,server,location | 默认值：TLSv1 TLSv1.1 TLSv1.2 TLSv1.3
    # 安全建议：仅使用 TLSv1.2 及以上版本
    # FRP 代理场景：通常与本地服务通信（HTTP），此设置为备用
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # proxy_ssl_ciphers 指令：与上游通信的加密算法
    # 类型：String | 作用域：http,server,location | 默认值：DEFAULT
    proxy_ssl_ciphers HIGH:!aNULL:!MD5;

    # proxy_ssl_server_name 指令：与 HTTPS 上游通信时发送 SNI (Server Name Indication)
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 必须开启，支持多 HTTPS 上游服务器的 SNI 认证
    proxy_ssl_server_name on;

    # proxy_ssl_session_reuse 指令：是否会复用与上游的 SSL 会话
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # 性能优化，减少到上游服务器的 SSL 握手次数
    proxy_ssl_session_reuse on;

    # proxy_ssl_verify 指令：是否验证上游服务器的 SSL 证书
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 生产环境推荐开启，防止 MITM 攻击
    # proxy_ssl_verify on;

    # proxy_ssl_verify_depth 指令：证书链验证深度
    # 类型：Number | 作用域：http,server,location | 默认值：1
    # proxy_ssl_verify_depth 2;

    # proxy_ssl_trusted_certificate 指令：信任的 CA 证书路径
    # 类型：String | 作用域：http,server,location | 默认值：无
    # proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # ============ SSL/TLS 全局配置 ============

    # ssl_buffer_size 指令：SSL 记录层缓冲区大小
    # 类型：Size | 作用域：http,server | 默认值：16k
    # 大值增加延迟但减少记录数，推荐 4k 或 16k
    ssl_buffer_size 4k;

    # ssl_protocols 指令：启用的 TLS 协议版本
    # 类型：String | 作用域：http,server | 默认值：TLSv1 TLSv1.1 TLSv1.2 TLSv1.3 (v1.27.3+)
    # 安全建议：仅使用 TLSv1.2 及以上，禁用旧版本（易受攻击）
    ssl_protocols TLSv1.2 TLSv1.3;

    # ssl_ciphers 指令：启用的 TLS 加密算法套件
    # 类型：String | 作用域：http,server | 默认值：HIGH:!aNULL:!MD5
    # 格式：OpenSSL cipher list format
    # 强度等级：HIGH > MEDIUM > LOW / 避免：NULL | aNULL | eNULL | MD5 | RC4 | DES
    # 推荐：ECDHE 密钥交换 + ChaCha20 或 AES-GCM
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CAMELLIA256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA';

    # ssl_prefer_server_ciphers 指令：是否优先使用服务器指定的加密算法
    # 类型：on|off | 作用域：http,server | 默认值：off
    # on  ：服务器决定（推荐，防止客户端选择弱算法）
    # off ：客户端决定
    ssl_prefer_server_ciphers on;

    # ssl_ecdh_curve 指令：用于 ECDHE 密钥交换的椭圆曲线
    # 类型：String | 作用域：http,server | 默认值：auto
    # auto ：自动选择（OK）或显式指定强曲线如 prime256v1
    # ssl_ecdh_curve auto;

    # ssl_session_cache 指令：SSL 会话缓存类型和大小
    # 类型：off|none|builtin|shared | 作用域：http,server | 默认值：none
    # shared:SSL:10m ：all worker 共享，10MB cache，约 4000 会话
    # 性能优化，减少客户端重新握手，推荐启用
    ssl_session_cache shared:SSL:10m;

    # ssl_session_timeout 指令：缓存的 SSL 会话有效期
    # 类型：Time | 作用域：http,server | 默认值：5m
    # 推荐值：10m-1h（平衡内存和会话复用效率）
    ssl_session_timeout 10m;

    # ssl_session_tickets 指令：是否启用 Session Ticket（TLSv1.2 会话复用）
    # 类型：on|off | 作用域：http,server | 默认值：on
    # 减少 SSL 握手，但需要谨慎密钥管理（定期轮换）
    ssl_session_tickets on;

    # ssl_session_ticket_key 指令：Session Ticket 加密密钥
    # 类型：String | 作用域：http,server | 默认值：auto（自动生成）
    # 仅在需要多个 Nginx 实例共享会话时指定，生产环境不需要
    # ssl_session_ticket_key /path/to/ticket.key;

    # ssl_stapling 指令：启用 OCSP Stapling（证书状态在握手中发送）
    # 类型：on|off | 作用域：http,server | 默认值：off
    # 性能优化，减少客户端查询 OCSP 服务器的延迟
    # 需要配合 ssl_stapling_responder 和 ssl_stapling_verify
    # ssl_stapling on;

    # ssl_stapling_responder 指令：OCSP 响应器 URL
    # 类型：String | 作用域：http,server | 默认值：无
    # ssl_stapling_responder "http://ocsp.example.com";

    # ssl_stapling_verify 指令：是否验证 OCSP 响应
    # 类型：on|off | 作用域：http,server | 默认值：off
    # ssl_stapling_verify on;

    # ssl_stapling_file 指令：OCSP 响应缓存文件路径
    # 类型：String | 作用域：http,server | 默认值：无
    # ssl_stapling_file /var/cache/nginx/ocsp.staple;

    # ============ 额外安全和性能配置 ============

    # open_file_cache 指令：缓存已打开文件的描述符和元数据
    # 类型：off | max=N [inactive=time] | 作用域：http,server,location | 默认值：off
    # 性能收益：减少文件系统操作，适合静态文件服务
    # 个人场景：减少缓存数量以节省内存（5000 足够）
    open_file_cache max=5000 inactive=60s;

    # open_file_cache_valid 指令：缓存元数据有效期
    # 类型：Time | 作用域：http,server,location | 默认值：60s
    open_file_cache_valid 60s;

    # open_file_cache_min_uses 指令：文件缓存最少访问次数
    # 类型：Number | 作用域：http,server,location | 默认值：1
    # 仅访问指定次数以上的文件才进入缓存，减少缓存污染
    open_file_cache_min_uses 2;

    # open_file_cache_errors 指令：是否缓存文件不存在等错误
    # 类型：on|off | 作用域：http,server,location | 默认值：off
    # 缓存 404 等错误，减少后续重复查询，推荐开启
    open_file_cache_errors on;

    # etag 指令：是否自动生成 ETag 响应头
    # 类型：on|off | 作用域：http,server,location | 默认值：on
    # ETag 用于缓存验证和并发控制，推荐保持开启
    etag on;

    # if_modified_since 指令：如何处理 If-Modified-Since 请求头
    # 类型：off|exact|before | 作用域：http,server,location | 默认值：exact
    # exact  ：精确匹配 / before ：响应修改时间 <= 请求时间视为未修改
    if_modified_since exact;

    # resolver 指令：配置 DNS 名称服务器（用于代理时域名解析）
    # 类型：Address | 作用域：http,server,location | 默认值：无
    # 作用：proxy_pass 到外部域名时使用（如 nyaa.si）
    # 使用公共 DNS 服务器：
    #   1. 8.8.8.8       - Google Public DNS（主）
    #   2. 8.8.4.4       - Google Public DNS（备用）
    # valid=300s：DNS 结果缓存 5 分钟，减少重复查询
    # 可选优化：
    #   - 如有本地 DNS（Technitium DNS、Pi-hole 等）：可添加 127.0.0.1 到最前面
    #   - 示例：resolver 127.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    # ⚠️  Docker 部署注意：
    #     - host 网络模式：可使用 127.0.0.1 访问宿主机服务 ✅
    #     - bridge 模式：需改为 172.17.0.1 或 host.docker.internal
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # resolver_timeout 指令：DNS 查询超时
    # 类型：Time | 作用域：http,server,location | 默认值：30s
    # 10s ：单次 DNS 查询最多等待 10 秒（本地 DNS 通常 <100ms）
    resolver_timeout 10s;

    # ============ 包含其他配置文件 ============

    include /etc/nginx/conf.d/*.conf;
}