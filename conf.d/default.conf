# ============================================
# 默认服务器配置 - 拦截所有非法访问
# ============================================
# 用途：捕获所有不符合业务域名的请求（IP 访问、未知域名、域名+端口等）
# 策略：返回 403 Forbidden 错误页面，防止信息泄露和恶意扫描
# 优先级：所有其他 server 块优先匹配，此块为兜底配置

# --- HTTP 默认服务器 (端口 80) ---
server {
    # listen 指令：监听 80 端口，标记为 default_server
    # 类型：port [default_server] | 作用域：server | 默认值：80
    # default_server 参数：
    #   - 当请求的 Host 头不匹配任何 server_name 时，使用此 server 块处理
    #   - 每个 IP:port 组合只能有一个 default_server
    #   - 典型场景：IP 直接访问、错误域名、恶意扫描
    listen 80 default_server;
    listen [::]:80 default_server;  # IPv6 支持

    # server_name 指令：使用下划线表示"无效主机名"
    # 类型：String | 作用域：server | 默认值：""
    # 下划线（_）：Nginx 保留字符，表示匹配所有未被其他 server 块匹配的请求
    # 注意：
    #   - 这不是通配符域名，只是一个占位符
    #   - 实际匹配逻辑由 default_server 参数控制
    server_name _;

    # root 指令：定义文档根目录（用于错误页面）
    # 类型：String | 作用域：http,server,location | 默认值：html
    # 作用：即使返回错误，nginx 也需要知道从哪里读取错误页面
    root /etc/nginx/conf.d;

    # --- 全局拦截：返回 403 Forbidden ---
    location / {
        # return 指令：直接返回 HTTP 状态码并关闭连接
        # 类型：code [text] | 作用域：server,location,if | 默认值：无
        # 状态码选项：
        #   403 ：Forbidden（禁止访问）- 返回错误页面
        #   444 ：Nginx 自定义码，直接关闭连接（不返回任何数据）
        #   410 ：Gone（资源已永久删除）
        # 推荐 403：符合 HTTP 语义，便于日志审计
        return 403;
    }

    # --- 错误页面映射 ---
    # 拦截所有非法访问时统一返回 403 错误页面
    error_page 403 /error-pages/noise/403.html;

    # --- 错误页面文件服务 ---
    location /error-pages/noise {
        # internal 指令：仅允许内部重定向访问
        # 类型：无参 | 作用域：location | 默认值：无
        # 安全作用：防止客户端直接枚举错误页面路径
        internal;

        # root 指令：错误页面文件的根目录
        # 最终文件路径 = /etc/nginx/conf.d/error-pages/noise/403.html
        root /etc/nginx/conf.d;
    }

    # --- 访问日志配置 ---
    # access_log 指令：记录所有被拦截的非法访问
    # 类型：path [format] | 作用域：http,server,location | 默认值：logs/access.log combined
    # 用途：
    #   - 审计恶意扫描流量（IP 访问、域名猜测）
    #   - 分析攻击来源和频率
    #   - 配合防火墙策略（fail2ban 等）
    access_log /var/log/nginx/default_access.log combined;
    error_log /var/log/nginx/default_error.log warn;
}

# --- HTTPS 默认服务器 (端口 443) ---
server {
    # listen 指令：监听 443 端口，启用 SSL，标记为 default_server
    # 类型：port ssl http2 [default_server] | 作用域：server
    # ssl           ：启用 TLS/SSL 加密
    # http2         ：启用 HTTP/2（即使是拦截请求，保持协议兼容）
    # default_server：捕获所有 HTTPS 非法访问
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;  # IPv6 支持

    # server_name 指令：同 HTTP 默认服务器，使用下划线占位符
    server_name _;

    # --- SSL 证书配置（自签名证书） ---
    # ⚠️  重要提示：HTTPS 握手必须提供证书，即使是拦截请求
    # 解决方案：生成自签名证书（客户端会收到证书警告，符合拦截预期）
    # 生成命令（执行一次）：
    #   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #     -keyout /etc/nginx/conf.d/cert/default/selfsigned.key \
    #     -out /etc/nginx/conf.d/cert/default/selfsigned.crt \
    #     -subj "/CN=invalid.local"
    #
    # ssl_certificate 指令：SSL 证书文件路径
    # 类型：file | 作用域：http,server | 默认值：无
    # 内容：包含公钥的 PEM 格式证书（可包含证书链）
    ssl_certificate /etc/nginx/conf.d/cert/default/selfsigned.crt;

    # ssl_certificate_key 指令：SSL 私钥文件路径
    # 类型：file | 作用域：http,server | 默认值：无
    # 内容：PEM 格式私钥（RSA/ECDSA）
    # 权限要求：600（仅 root/nginx 用户可读）
    ssl_certificate_key /etc/nginx/conf.d/cert/default/selfsigned.key;

    # --- SSL 协议和加密套件（继承 nginx.conf 全局配置） ---
    # 注意：主配置文件中已定义 ssl_protocols 和 ssl_ciphers，此处无需重复
    # 若未定义全局配置，可在此添加：
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # root 指令：定义文档根目录
    root /etc/nginx/conf.d;

    # --- 全局拦截：返回 403 Forbidden ---
    location / {
        # return 指令：返回 403 状态码
        # 客户端行为：
        #   - 浏览器显示证书警告（自签名证书）→ 用户强制继续 → 显示 403 错误页面
        #   - 自动化扫描工具（curl、wget）直接收到 403
        return 403;
    }

    # --- 错误页面映射 ---
    error_page 403 /error-pages/noise/403.html;

    # --- 错误页面文件服务 ---
    location /error-pages/noise {
        internal;
        root /etc/nginx/conf.d;
    }

    # --- 访问日志配置 ---
    access_log /var/log/nginx/default_ssl_access.log combined;
    error_log /var/log/nginx/default_ssl_error.log warn;
}

# ============================================
# 部署前准备工作
# ============================================
# 1. 创建自签名证书目录：
#    mkdir -p /etc/nginx/conf.d/cert/default
#
# 2. 生成自签名证书（有效期 10 年）：
#    openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#      -keyout /etc/nginx/conf.d/cert/default/selfsigned.key \
#      -out /etc/nginx/conf.d/cert/default/selfsigned.crt \
#      -subj "/CN=invalid.local"
#
# 3. 设置证书权限（安全加固）：
#    chmod 600 /etc/nginx/conf.d/cert/default/selfsigned.key
#    chmod 644 /etc/nginx/conf.d/cert/default/selfsigned.crt
#
# 4. 测试配置并重载：
#    nginx -t && systemctl reload nginx
#
# ============================================
# 测试验证
# ============================================
# 1. IP 访问测试（应返回 403）：
#    curl http://YOUR_SERVER_IP/
#    curl -k https://YOUR_SERVER_IP/
#
# 2. 错误域名测试（应返回 403）：
#    curl -H "Host: unknown.domain" http://YOUR_SERVER_IP/
#
# 3. 域名+端口测试（应返回 403）：
#    curl http://yourdomain.com:8080/
#
# 4. 正确域名测试（应正常访问）：
#    curl http://yourdomain.com/
#
# ============================================
# 安全说明
# ============================================
# 1. 自签名证书不暴露真实证书信息，防止信息泄露
# 2. 403 错误码明确告知"禁止访问"，而非"找不到资源"（404）
# 3. 日志独立记录，便于分析恶意扫描行为
# 4. 可配合 fail2ban 自动封禁频繁触发 403 的 IP
